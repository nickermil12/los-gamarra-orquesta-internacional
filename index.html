<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Gamarra - Orquesta Internacional</title>
  <meta name="description" content="Los Gamarra - Orquesta Internacional. Síguenos en nuestras redes y contáctanos para contrataciones.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #3a2a00 0%, #120e05 32%, #050505 70%);
      display: flex;
      justify-content: center;
      padding: 24px 14px 40px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    .logo {
      width: min(280px, 75vw);
      height: auto;
      display: block;
      margin: 5px auto 12px;
      border-radius: 50%;
    }
    h1 {
      margin: 4px 0 6px;
      font-size: 25px;
      letter-spacing: .5px;
    }
    .subtitle {
      color: #e9d98c;
      margin: 0 0 22px;
      font-size: 15px;
    }
    .buttons {
      display: grid;
      gap: 13px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 13px 18px;
      border: 1px solid #caa62d;
      border-radius: 15px;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #17130a, #29200a);
      box-shadow: 0 5px 18px rgba(0,0,0,.35);
      transition: transform .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-2px); background: linear-gradient(135deg, #29200a, #46350b); }
    .icon { width: 30px; margin-right: 10px; font-size: 22px; }
    .contact {
      margin-top: 18px;
      padding: 16px;
      border-radius: 15px;
      border: 1px solid #8e7220;
      background: rgba(0,0,0,.42);
    }
    .contact-title { color: #f0d56b; font-weight: 800; margin-bottom: 7px; }
    .footer { margin-top: 22px; color: #a99d78; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Los Gamarra Orquesta Internacional">
    <h1>Los Gamarra Orquesta Internacional</h1>
    <p class="subtitle">Música • Alegría • Sabor</p>

    <div class="buttons">
      <a class="btn" href="https://www.facebook.com/share/1LVDB4H5Dk/" target="_blank" rel="noopener">
        <span class="icon">📘</span> Facebook
      </a>
      <a class="btn" href="https://www.tiktok.com/@los_gamarra_orquesta_int?_r=1&_t=ZS-9AALU2Qa9uX" target="_blank" rel="noopener">
        <span class="icon">🎵</span> TikTok
      </a>
      <a class="btn" href="https://www.instagram.com/losgamarra.orquestainter?stkn=MW9rYnh6bjM3MGJzYg==" target="_blank" rel="noopener">
        <span class="icon">📸</span> Instagram
      </a>
      <a class="btn" href="https://youtube.com/@losgamarraorquestainternaciona?si=aLaHbJkqqu5ImMF7" target="_blank" rel="noopener">
        <span class="icon">▶️</span> YouTube
      </a>
      <a class="btn" href="https://wa.me/51942180088" target="_blank" rel="noopener">
        <span class="icon">💬</span> WhatsApp - Contrataciones
      </a>
    </div>

    <div class="contact">
      <div class="contact-title">📞 Contrataciones</div>
      <div>942 180 088</div>
    </div>

    <div class="footer">© Los Gamarra Orquesta Internacional</div>
  </main>
</body>
</html>
