<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: radial-gradient(
        circle at 50% -10%,
        #4b3700 0%,
        #171206 30%,
        #050505 68%
    );

    display: flex;
    justify-content: center;
    padding: 25px 14px 40px;
}

.card {
    width: 100%;
    max-width: 460px;
    text-align: center;
}

.logo {
    width: min(290px, 78vw);
    display: block;
    margin: 0 auto 8px;
}

h1 {
    margin: 5px 0 6px;
    font-size: 25px;
}

.subtitle {
    color: #ead37a;
    margin: 0 0 22px;
    font-size: 15px;
}

.buttons {
    display: grid;
    gap: 13px;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 60px;
    padding: 12px 18px;

    border: 1px solid #caa62d;
    border-radius: 16px;

    color: white;
    text-decoration: none;

    font-size: 17px;
    font-weight: bold;

    background: linear-gradient(
        135deg,
        #17130a,
        #29200a
    );

    box-shadow: 0 5px 18px rgba(0,0,0,.35);
}

.btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(
        135deg,
        #2b220d,
        #4a390d
    );
}

.icon {
    width: 32px;
    height: 32px;
    margin-right: 12px;
    flex: 0 0 32px;
}

.contact {
    margin-top: 18px;
    padding: 16px;

    border-radius: 16px;
    border: 1px solid #8e7220;

    background: rgba(0,0,0,.42);
}

.contact-title {
    color: #f0d56b;
    font-weight: bold;
    margin-bottom: 7px;
}

.footer {
    margin-top: 22px;
    color: #a99d78;
    font-size: 12px;
}
</style>

</head>
